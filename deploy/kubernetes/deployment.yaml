# redfish-exporter Kubernetes deployment example.
# Apply with: kubectl apply -f deploy/kubernetes/deployment.yaml
#
# Create the password Secret before applying this file; do not commit the value:
# kubectl create secret generic redfish-exporter-credentials \
#   --from-literal=bmc1-password='<real-password>'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redfish-exporter-config
  labels:
    app: redfish-exporter
data:
  config.yaml: |
    # default is 127.0.0.1; 0.0.0.0 is required here so Prometheus can reach the pod — add web.auth_token/tls when the cluster is not a trusted network (docs/security.md)
    listen_addr: "0.0.0.0:9417"
    scrape_interval: "30s"
    scrape_timeout: "15s"
    request_timeout: "10s"
    collectors:
      event_logs: false
      event_log_limit: 500
      bios_attributes: false
      bios_attribute_limit: 10000
    bmcs:
      - name: bmc1
        host: https://10.0.0.1
        username: admin
        # Password is supplied by REDFISH_EXPORTER_PASSWORD_BMC1 from a Secret.
        auth: basic
        insecure_skip_verify: false
        ca_cert_file: null
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-exporter
  labels:
    app: redfish-exporter
spec:
  selector:
    app: redfish-exporter
  ports:
    - name: metrics
      port: 9417
      targetPort: 9417
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-exporter
  labels:
    app: redfish-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redfish-exporter
  template:
    metadata:
      labels:
        app: redfish-exporter
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redfish-exporter
          image: ghcr.io/franckcl1989/redfish-exporter:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/redfish-exporter/config.yaml"
          ports:
            - name: metrics
              containerPort: 9417
              protocol: TCP
          env:
            - name: REDFISH_EXPORTER_PASSWORD_BMC1
              valueFrom:
                secretKeyRef:
                  name: redfish-exporter-credentials
                  key: bmc1-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9417
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9417
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/redfish-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redfish-exporter-config
