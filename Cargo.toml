[package]
name = "redfish-exporter"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Prometheus exporter for Redfish BMCs, built on nv-redfish"
repository = "https://github.com/franckcl1989/redfish-exporter"
readme = "README.md"
keywords = ["redfish", "prometheus", "exporter", "bmc", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
nv-redfish = { version = "0.15", default-features = false, features = [
    "bmc-http", "chassis", "computer-systems", "managers", "assembly",
    "sensors", "thermal", "power", "power-supplies", "controls", "environment-metrics",
    "processors", "memory", "storages", "ethernet-interfaces",
    "network-adapters", "ports", "pcie-devices", "update-service", "session-service",
    "log-services", "bios", "oem",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
axum = "0.8"
# tls-rustls-no-provider：provider 由 reqwest 侧的 rustls/ring 统一提供，
# 避免 aws-lc-rs 与 ring 双 feature 导致的 CryptoProvider 无法自动确定。
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# header 读超时需要显式 Timer（hyper-util 的 TokioTimer），否则 hyper 会 panic。
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
prometheus = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
humantime = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
sysinfo = "0.30"
nv-redfish-bmc-mock = "0.15"
rcgen = "0.13"
# TLS 零字节慢连接测试的客户端（树中已存在，仅新增 dev 边）
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Light optimization for performance/resource/soak test harnesses. A true release
# performance run is part of release qualification; PR gates prioritize timely
# leak/size/behavior feedback and do not ship this profile.
[profile.release-gates]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false
strip = "none"
incremental = true
