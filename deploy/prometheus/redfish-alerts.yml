# Example Prometheus alert rules for redfish-exporter.
# Merge into your Prometheus configuration (rule_files) and adjust as needed.
groups:
  - name: redfish
    rules:
      - alert: RedfishBMCUnreachable
        expr: redfish_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redfish BMC {{ $labels.bmc }} is unreachable"
          description: "The BMC {{ $labels.bmc }} failed its last scrape (redfish_up == 0) for more than 5 minutes."

      - alert: RedfishBMCScrapeError
        expr: redfish_scrape_error == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redfish scrape error on {{ $labels.bmc }}"
          description: "Resource {{ $labels.resource }} on BMC {{ $labels.bmc }} failed to be collected (redfish_scrape_error == 1)."

      - alert: RedfishSensorCritical
        expr: redfish_sensor_reading >= on(bmc, chassis, id) redfish_sensor_threshold_upper_critical
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sensor {{ $labels.name }} on {{ $labels.bmc }} exceeds its critical threshold"
          description: "Sensor {{ $labels.name }} ({{ $labels.units }}) on BMC {{ $labels.bmc }} reads {{ $value }} and is at or above its upper critical threshold for more than 5 minutes."

      - alert: RedfishDrivePredictiveFailure
        expr: redfish_drive_predictive_failure == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Drive {{ $labels.id }} on {{ $labels.bmc }} predicts failure"
          description: "Drive {{ $labels.id }} (storage {{ $labels.storage }}) on BMC {{ $labels.bmc }} reports a predicted failure in the near future."

      - alert: RedfishLinkDown
        expr: redfish_ethernet_interface_link_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ethernet link {{ $labels.id }} on {{ $labels.bmc }} is down"
          description: "Ethernet interface {{ $labels.id }} on system {{ $labels.system }} of BMC {{ $labels.bmc }} has been down for more than 5 minutes."
